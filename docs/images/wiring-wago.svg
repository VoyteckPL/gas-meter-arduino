<text x="1228" y="485" font-size="12" fill="#263238" font-weight="700" text-anchor="middle">KONTAKTRON</text>
<text x="1228" y="501" font-size="12" fill="#546e7a" font-weight="400" text-anchor="middle">(reed)</text>
<polyline points="1180,390 1228,390 1228,400" fill="none" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1180,450 1228,450 1228,470" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1185" y="378" font-size="12" fill="#e65100" font-weight="700" text-anchor="start">żółty → D12</text>
<text x="1185" y="440" font-size="12" fill="#546e7a" font-weight="700" text-anchor="start">biały → GND</text>
<line x1="30" y1="656" x2="1250" y2="656" stroke="#cfd8dc"/>
<text x="30" y="678" font-size="18" fill="#263238" font-weight="700" text-anchor="start">Co ile wejść i gdzie</text>
<text x="30" y="706" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• PLUS (5 wejść, użyte 4): ogniwo A +, ogniwo B +, czerwony do płytki (BAT+), góra dzielnika (R1).</text>
<text x="30" y="730" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• MINUS / GND (5 wejść, użyte 4): ogniwo A −, ogniwo B −, czarny do płytki (BAT−), dół dzielnika (R2 i kondensator).</text>
<text x="30" y="754" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Bez włącznika: zasilanie odcinasz wyjmując ogniwa, a restart robi przycisk RST na płytce albo przycisk Restart w apce.</text>
<text x="30" y="778" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Reed i środek dzielnika idą bezpośrednio do pinów płytki (lut lub dupont), nie przez Wago.</text>
<text x="30" y="830" font-size="18" fill="#263238" font-weight="700" text-anchor="start">Tulejki i Wago</text>
<text x="30" y="860" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Tulejkę dobierz do przekroju linki: cienkie przewody (reed, dzielnik) 0,25 lub 0,34 mm², grubsze 0,5 mm². Zaciśnij zaciskarką, żeby tuleja była okrągła lub kwadratowa.</text>
<text x="30" y="884" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Wago 221: odizoluj ok. 11 mm albo użyj tulejki i wsuń do oporu. Dźwignię zamknij do końca, pociągnij przewód na próbę.</text>
<text x="30" y="908" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Linek nie cynuj pod Wago. Lutuj tylko rezystory, kondensator i przewody do pinów płytki.</text>
<text x="30" y="932" font-size="14" fill="#263238" font-weight="400" text-anchor="start">• Sprawdź na stole: napięcie na ogniwach równe (różnica poniżej 0,1 V) PRZED połączeniem równoległym.</text>
<text x="30" y="960" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="start">Kolejność: 1) dzielnik zlutuj i sprawdź (R1+R2 ≈ 200 kΩ).  2) Wago PLUS, MINUS, GND z tulejkami.  3) wtyk PH2.0 do płytki.  4) reed i A0.  5) dopiero na końcu ogniwa.</text>
</svg>