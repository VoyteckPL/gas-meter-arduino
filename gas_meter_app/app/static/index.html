<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gazomierz</title>
  <link rel="stylesheet" href="static/app.css?v=__V__">
</head>
<body>
  <header><div class="hwrap">
    <div class="top">
      <div class="logo"><img src="static/logo.png?v=__V__" alt="Gazomierz"></div>
      <div class="ttl"><h1 id="title">Gazomierz</h1><small id="sub">ładowanie…</small></div>
      <span class="pill" id="conn"><span class="dot wait" id="connDot"></span><span id="connTxt">…</span></span>
      <button class="iconbtn" id="refreshBtn" title="Odśwież">⟳</button>
    </div>
    <nav class="viewtabs" id="viewTabs">
      <button class="active" data-view="panel" id="tabPanel">Przegląd</button>
      <button data-view="boiler" id="tabBoiler">Piec</button>
      <button data-view="usage" id="tabUsage">Zużycie</button>
      <button data-view="battery" id="tabBattery">Bateria</button>
      <button data-view="network" id="tabNetwork">Sieć</button>
      <button data-view="service" id="tabService">OTA</button>
      <span class="tab-ind" id="tabInd"></span>
    </nav>
  </div></header>

  <main id="root">
    <p class="muted" id="loading">Ładowanie…</p>
  </main>

  <div id="boilerView" class="bgrid view2" hidden></div>
  <div id="usageView" class="bgrid view2" hidden></div>
  <div id="batteryView" class="bgrid view2" hidden></div>
  <div id="networkView" class="bgrid view2" hidden></div>
  <div id="serviceView" class="bgrid view2" hidden></div>


  <div id="toast" class="toast" hidden></div>
  <script>window.ASSET_V = "__V__";</script>
  <script src="static/timechart.js?v=__V__"></script>
  <script src="static/app.js?v=__V__"></script>
</body>
</html>
