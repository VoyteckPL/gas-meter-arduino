<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gas meter</title>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <header>
    <h1 id="title">Gas meter</h1>
    <div class="head-right">
      <span id="conn" class="badge off">...</span>
      <button id="langBtn" class="ghost" title="Language">PL / EN</button>
    </div>
  </header>

  <nav class="viewtabs" id="viewTabs">
    <button class="secondary active" data-view="panel" id="tabPanel">Overview</button>
    <button class="secondary" data-view="battery" id="tabBattery">Battery</button>
    <button class="secondary" data-view="settings" id="tabSettings">Settings</button>
    <button class="secondary" data-view="network" id="tabNetwork">Network</button>
    <button class="secondary" data-view="service" id="tabService">Service</button>
    <button class="secondary" data-view="demo" id="tabDemo">Demo</button>
  </nav>

  <main id="root">
    <p class="muted" id="loading">Loading...</p>
  </main>

  <div id="batteryView" class="bgrid" hidden></div>
  <div id="settingsView" class="bgrid" hidden></div>
  <div id="networkView" class="bgrid" hidden></div>
  <div id="serviceView" class="bgrid" hidden></div>

  <div id="demoView" class="demo" hidden></div>

  <div id="toast" class="toast" hidden></div>
  <script src="static/app.js"></script>
</body>
</html>
