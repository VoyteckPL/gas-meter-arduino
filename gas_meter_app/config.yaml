name: "Energia Gazomierz"
version: "0.29.3"
slug: "gas_meter"
description: "Panel i ustawienia gazomierza na baterii (ESP32, MQTT): odczyty, historia, bateria z prognozą żywotności, powiadomienia."
url: "https://github.com/VoyteckPL/gas-meter-arduino"
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
homeassistant_api: true
ingress_port: 8099
panel_icon: "mdi:meter-gas"
panel_title: "Energia Gazomierz"
panel_admin: false
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Pobieranie firmware przez gazomierz (tylko przy uzbrojonej aktualizacji)"
services:
  - mqtt:want
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  root_topic: "Gaz/Gazomierz"
  battery_test_topic: "Gaz/BatteryTest"
  battery_preset: "NCR18650GA"
  battery_cells: 2
  battery_cell_mah: 3000
  battery_usable_pct: 85
  notify_service: ""
  notify_persistent: true
  battery_report: "monthly"
  battery_warn_days: 45
  battery_critical_days: 14
  silent_alert_hours: 48
  boiler_entity: "sensor.ariston_genus_one_status_kotla"
  ota_key: ""
  ota_host: ""
  publish_discovery: true
  language: "auto"
schema:
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_user: "str?"
  mqtt_password: "password?"
  root_topic: "str"
  battery_test_topic: "str?"
  battery_preset: "list(NCR18650GA|NCR18650B|NCR18650PF|INR18650-35E|INR18650-30Q|INR18650-MJ1|INR18650-25R|custom)"
  battery_cells: "int(1,8)"
  battery_cell_mah: "int(500,10000)"
  battery_usable_pct: "int(50,100)"
  notify_service: "str?"
  notify_persistent: "bool"
  battery_report: "list(off|weekly|monthly)"
  battery_warn_days: "int(1,365)"
  battery_critical_days: "int(1,365)"
  silent_alert_hours: "int(0,720)"
  boiler_entity: "str?"
  ota_key: "password?"
  ota_host: "str?"
  publish_discovery: "bool"
  language: "list(auto|pl|en)"
